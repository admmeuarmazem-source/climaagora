name: CI & Cloudflare Deployment

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Lint / Type Check
        run: npm run lint

      - name: Build Application
        run: npm run build
        env:
          NODE_ENV: production

      # Se o usuário configurar o segredo do CLOUDFLARE_API_TOKEN no GitHub:
